<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/login.css">
    <title>TIGRINHO - Sign Up</title>
</head>
<body>
    

    <form action="auth/signup.php" method="post">
        <h1>Sign Up</h1>

        <div id="input-container">
            <div class="input">
                <label for="username">Usuário: </label>
                <input type="text" name="username" id="username_id" required placeholder="Digite o Usuário...">
            </div>

            <div class="input">
                <label for="email">Email: </label>
                <input type="email" name="email" id="email_id" required placeholder="Digite o Email...">
            </div>

            <div class="input">
                <label for="password">Senha: </label>
                <input type="password" name="password" id="password_id" required placeholder="Digite a Senha...">
            </div>
        </div>






        
        <button type="submit">Cadastrar</button>
        
        <span>Já possui uma conta? <a href="login.html">Clique Aqui!</a></span>
    </form>

    <div id="img">
        <div id="filter"></div>
        <img src="src/assets/pessoa_correndo_bg.jpg" alt="placeholder image">
    </div>

    </div>
</body>
</html>
