<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGRINHO - Sign Up</title>
</head>
<body>
    <h1>Sign Up</h1>

    <form action="auth/signup.php" method="post">
        <input type="text" name="username" id="username_id" placeholder="Usuário" required>
        <input type="email" name="email" id="email_id" placeholder="Email" required>
        <input type="password" name="password" id="password_id" placeholder="Senha" required>
        <button type="submit">Cadastrar</button>
    </form>

    <span>Já possui uma conta? <a href="login.html">Clique Aqui!</a></span>
</body>
</html>
