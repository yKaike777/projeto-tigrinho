<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/login.css">
    <title>TIGRINHO - Login</title>
</head>
<body>
    

    <form action="auth/login.php" method="post">
        <h1>LOGIN TIGRINHO</h1>
        <div id="input-container">

            <div class="input-group">
                <div class="input">
                        <label for="email">Email: </label>
                        <input type="email" name="email" id="email_id" required>
                </div>

                <div class="input">
                        <label for="password">Senha: </label>
                        <input type="password" name="password" id="password_id" required>
                </div>
            </div>


        </div>

        <button type="submit">Entrar</button>
        <span>Não possui uma conta? <a href="signup.html">Clique Aqui!</a></span>
    </form>

    <div id="img">
        <img src="" alt="imagem de login">
    </div>
</body>
</html>
